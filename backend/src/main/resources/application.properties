# ── Serveur ──
server.port=${PORT:8888}

# ── Docker Compose auto-start (désactivé — nécessite Docker Desktop actif) ──
# Mettre à true si Docker Desktop tourne et que tu veux l'auto-démarrage de postgres/redis
spring.docker.compose.enabled=false

# ── Base de données PostgreSQL ──
spring.datasource.url=jdbc:postgresql://localhost:5432/intellcap_db
spring.datasource.username=intellcap_user
spring.datasource.password=intellcap_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Initialisation données ──
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ── JWT ──
jwt.secret=INTELLCAP_SECRET_KEY_CHANGE_IN_PRODUCTION_2026_MIN_32_CHARS
jwt.expiration=86400000

# ── Email — CDC Section 4 ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=contact@intellcap.fr
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── reCAPTCHA — CDC Section 4.3 ──
recaptcha.secret=${RECAPTCHA_SECRET:}

# ── Logging ──
logging.level.fr.intellcap.backend=INFO
logging.level.org.springframework.security=WARN